[project]
name = "pokertrainer"
version = "0.1.0"
description = "Simulador instrutivo de probabilidades de mãos de poker (Texas Hold'em) — Linux/macOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6",
]

[project.scripts]
pokertrainer = "pokertrainer.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
